<mat-sidenav-container class="shell" autosize>
  <mat-sidenav
    class="shell__sidenav"
    [mode]="isCompact() ? 'over' : 'side'"
    [opened]="sidenavOpened()"
    (closedStart)="layout.closeMobileNav()"
  >
    <app-sidebar [collapsed]="sidebarCollapsed()" (navigated)="onNavigated()" />
  </mat-sidenav>

  <mat-sidenav-content class="shell__content">
    <app-topbar (menuToggle)="toggleNav()" />
    <main class="shell__main">
      <app-breadcrumb />
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
