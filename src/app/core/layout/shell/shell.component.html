<div class="shell" [class.shell--collapsed]="sidebarCollapsed()">
  @if (!isCompact()) {
    <aside class="shell__sidebar">
      <app-sidebar [collapsed]="sidebarCollapsed()" (navigated)="onNavigated()" />
    </aside>
  }

  <div class="shell__content">
    <app-topbar (menuToggle)="toggleNav()" />
    <main class="shell__main">
      <app-breadcrumb />
      <router-outlet />
    </main>
  </div>
</div>

@if (isCompact()) {
  <p-drawer
    [visible]="layout.mobileNavOpen()"
    (onHide)="layout.closeMobileNav()"
    position="left"
    [showCloseIcon]="false"
    styleClass="shell__drawer"
  >
    <app-sidebar (navigated)="onNavigated()" />
  </p-drawer>
}
