<header class="topbar">
  <button pButton text rounded severity="secondary" type="button" aria-label="Ẩn/hiện menu" (click)="menuToggle.emit()">
    <app-icon pButtonIcon>menu</app-icon>
  </button>

  <span class="topbar__spacer"></span>

  <div class="topbar__actions">
    <app-network-indicator />
    @if (auth.user()) {
      <app-notification-bell />
    }

    <button
      pButton
      text
      rounded
      severity="secondary"
      type="button"
      [attr.aria-label]="theme.mode() === 'dark' ? 'Chuyển giao diện sáng' : 'Chuyển giao diện tối'"
      [pTooltip]="theme.mode() === 'dark' ? 'Giao diện sáng' : 'Giao diện tối'"
      tooltipPosition="bottom"
      (click)="theme.toggle()"
    >
      <app-icon pButtonIcon>{{ theme.mode() === 'dark' ? 'light_mode' : 'dark_mode' }}</app-icon>
    </button>
  </div>

  @if (auth.user(); as user) {
    <button class="user" type="button" aria-label="Tài khoản" aria-haspopup="menu" (click)="userMenu.toggle($event)">
      <app-user-avatar [name]="user.fullName" />
      <span class="user__info">
        <span class="user__name">{{ user.fullName }}</span>
        <span class="user__role">{{ auth.roleLabel() }}</span>
      </span>
      <app-icon class="user__caret">expand_more</app-icon>
    </button>

    <p-popover #userMenu styleClass="app-popover">
      <div class="menu" role="menu">
        <div class="menu__header">
          <app-user-avatar [name]="user.fullName" />
          <div>
            <p class="menu__name">{{ user.fullName }}</p>
            <p class="menu__meta">{{ user.email }}</p>
            <p class="menu__meta">{{ auth.roleLabel() }}</p>
          </div>
        </div>
        <div class="app-menu">
          @if (pwa.installAvailable()) {
            <button type="button" class="app-menu__item" role="menuitem" (click)="userMenu.hide(); pwa.install()">
              <app-icon>install_mobile</app-icon>
              <span>Cài đặt ứng dụng</span>
            </button>
          }
          @if (demoData.enabled) {
            <button type="button" class="app-menu__item" role="menuitem" [disabled]="resetting()" (click)="userMenu.hide(); resetDemoData()">
              <app-icon>restart_alt</app-icon>
              <span>Reset dữ liệu demo</span>
            </button>
          }
          <button type="button" class="app-menu__item app-menu__item--danger" role="menuitem" (click)="userMenu.hide(); logout()">
            <app-icon>logout</app-icon>
            <span>Đăng xuất</span>
          </button>
        </div>
      </div>
    </p-popover>
  }
</header>
