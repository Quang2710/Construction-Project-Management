<div class="brand">
  <span class="brand__logo" aria-hidden="true"><app-icon>foundation</app-icon></span>
  @if (!collapsed()) {
    <span class="brand__text">
      <span class="brand__name">{{ appName }}</span>
      <span class="brand__tagline">Quản lý dự án xây dựng</span>
    </span>
  }
</div>

<nav class="nav" aria-label="Menu chính">
  @for (section of sections(); track section.title) {
    @if (!collapsed()) {
      <h3 class="nav__section">{{ section.title }}</h3>
    } @else {
      <hr class="nav__divider" />
    }
    <ul class="nav__list">
      @for (item of section.items; track item.path) {
        <li>
          <a
            class="nav__item"
            [routerLink]="'/' + item.path"
            routerLinkActive="nav__item--active"
            ariaCurrentWhenActive="page"
            [pTooltip]="collapsed() ? item.label : undefined"
            tooltipPosition="right"
            (click)="navigated.emit()"
          >
            <app-icon class="nav__icon">{{ item.icon }}</app-icon>
            @if (!collapsed()) {
              <span class="nav__label">{{ item.label }}</span>
            }
          </a>
        </li>
      }
    </ul>
  }
</nav>
